# frozen_string_literal: true

# Конфигурация наград и бейджей (ТОКЕННАЯ МОДЕЛЬ, TFT).
#
# rewards — action_key → количество токенов TFT (начисление в user_rewards,
#           off-chain леджер; on-chain отправка через ContractService)
# badges  — badge_id → { key, name, icon, condition }
#           (репутационные достижения, не токены)

rewards:
  registration: 10
  referral_bonus_referrer: 15
  referral_bonus_new_user: 5
  poi_create: 10
  poi_photo_add: 3
  comment_create: 3
  poi_vote: 1

# Глобальная конфигурация reward pool-контракта (единицы — TFT, НЕ wei).
#   lock_days       — лок-период (дни). По умолчанию 7 (как в контракте TravelFiRewards).
#   warning_balance — порог «жёлтой» плашки: ниже → предупреждение админам (Noticed).
#   critical_balance— порог «красной» плашки: ниже → критический алерт (Noticed).
pool:
  lock_days: 7
  warning_balance: 10000000
  critical_balance: 1000000

badges:
  1:
    key: registration_complete
    name: Registration Complete
    icon: mdi-account-check
    condition: action == 'users#create'
  2:
    key: first_poi
    name: First POI
    icon: mdi-map-marker-star
    condition: user.pois.count == 1
  3:
    key: contributor
    name: Contributor
    icon: mdi-star-face
    condition: user.pois.count >= 10
  4:
    key: explorer
    name: Explorer
    icon: mdi-compass
    condition: user.poi_cities_count >= 5
  5:
    key: recruiter
    name: Recruiter
    icon: mdi-account-group
    condition: user.referrals_count >= 5
  6:
    key: veteran
    name: Veteran
    icon: mdi-shield-star
    condition: user.token_balance >= 1000
