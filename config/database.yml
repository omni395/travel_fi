default: &default
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { 'user' } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { 'password' } %>
  host: <%= ENV.fetch("DATABASE_HOST") { 'localhost' } %>
  # 1. ОТКЛЮЧАЕМ PREPARED STATEMENTS ВО ВСЕХ БАЗАХ:
  # Это гарантированно убирает Segmentation Fault (connect_start) в геме pg при многопоточной/многопроцессной работе Solid Queue.
  prepared_statements: false

development:
  primary:
    <<: *default
    adapter: postgis
    database: travel_fi_dev
    schema_search_path: public,postgis
  queue:
    <<: *default
    # 2. ИСПОЛЬЗУЕМ POSTGIS ВМЕСТО POSTGRESQL:
    # У тебя для primary используется адаптер postgis. Если у других баз стоял postgresql, 
    # ActiveRecord создает разные типы соединений в одном приложении, что тоже приводит к конфликтам C-расширений.
    adapter: postgis
    database: travel_fi_dev_queue
    schema_search_path: public,postgis
    database_tasks: false
  cache:
    <<: *default
    adapter: postgis
    database: travel_fi_dev_cache
    schema_search_path: public,postgis
    database_tasks: false
  cable:
    <<: *default
    adapter: postgis
    database: travel_fi_dev_cable
    schema_search_path: public,postgis
    database_tasks: false

test:
  primary:
    <<: *default
    adapter: postgis
    database: travel_fi_test
    schema_search_path: public,postgis
  queue: &test_queue
    <<: *default
    adapter: postgis
    database: travel_fi_test_queue
    schema_search_path: public,postgis
    database_tasks: false
  cache:
    <<: *default
    adapter: postgis
    database: travel_fi_test_cache
    schema_search_path: public,postgis
    database_tasks: false
  cable:
    <<: *default
    adapter: postgis
    database: travel_fi_test_cable
    schema_search_path: public,postgis
    database_tasks: false

production:
  primary:
    <<: *default
    adapter: postgis
    database: travel_fi_prod
    password: <%= ENV["TRAVEL_FI_DATABASE_PASSWORD"] %>
    schema_search_path: public,postgis
  queue:
    <<: *default
    adapter: postgis
    database: travel_fi_prod_queue
    schema_search_path: public,postgis
  cache:
    <<: *default
    adapter: postgis
    database: travel_fi_prod_cache
    schema_search_path: public,postgis
  cable:
    <<: *default
    adapter: postgis
    database: travel_fi_prod_cable
    schema_search_path: public,postgis